[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextrail"
version = "0.1.0"
description = "Versioned evidence and context handoffs for model-independent agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28,<3"]
oidc = ["PyJWT[crypto]>=2.10,<3"]
eval = ["inspect-ai==0.3.10", "openai>=3,<4"]
swebench = ["swebench==5.0.2"]

[project.scripts]
contextrail = "contextrail.cli:main"
contextrail-eval = "contextrail.evaluation.__main__:main"

[tool.setuptools.packages.find]
include = ["contextrail*"]

[tool.setuptools.package-data]
"contextrail" = ["*.ps1", "ui_static/*", "ui_static/work-view/*", "ui_static/work-view/assets/*"]
"contextrail._vendor" = ["*_LICENSE.txt"]
"contextrail._vendor.claude_mem" = ["*.ts", "*.mjs", "*.json", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
